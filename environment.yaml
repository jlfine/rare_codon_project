name: rcp_analysis_env
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Python version
  - python=3.12.11

  - pandas=2.3.2
  - numpy=2.3.2
  - scipy=1.16.1
  - scikit-learn=1.5.1
  - statsmodels=0.14.5

  # visualization
  - matplotlib=3.10.6
  - seaborn=0.13.2

  # bioinfo tools
  - biopython=1.85
  - pybedtools=0.12.0
  - pybigwig=0.3.24
  - ucsc-bigbedtobed
  - viennarna

  # Jupyter notebooks
  - jupyter
  - jupyterlab
  - ipython
  - ipykernel 

  # other utilities
  - pyyaml
  - pytest
  - rpy2

  # R packages (conda-forge)
  - r-ggplot2
  - r-dplyr
  - r-tidyr
  - r-survival

  # Bioconductor packages
  - bioconductor-enrichplot
  - bioconductor-clusterprofiler